<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MESH — Under maintenance</title>
<meta name="description" content="MESH is under maintenance and being rebranded. We will be back soon.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg: #0b0d10; --fg: #e8eaed; --muted: #9aa0a6; --line: #22262b; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f8fa; --fg: #15181c; --muted: #5f6368; --line: #dde1e6; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center;
  }
  main { max-width: 520px; }
  img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { font-size: 28px; margin: 24px 0 12px; letter-spacing: -0.01em; }
  p { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0 0 12px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
  a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="MESH">
  <h1>Under maintenance</h1>
  <p>MESH is being rebuilt and rebranded.</p>
  <p>The website and downloads are paused for now. We will be back soon.</p>
  <hr>
  <p>Contact: <a href="mailto:contact@meshprotocol.ru">contact@meshprotocol.ru</a></p>
</main>
</body>
</html>
